[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarverify"
version = "0.2.0"
description = "Requirements verification toolkit for SAR satellite mission delivery: access analysis, revisit, delivery latency and acceptance reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuceyb Hussein" }]
dependencies = ["numpy>=1.24", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sarverify = "sarverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
